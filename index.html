<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Western Visayas Cuisine</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Poppins:wght@300;400;500;600&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=arrow_right_alt">
</head>
            
<body>

    <!-- Welcome Page -->
    <div id="welcomePage" class="screen welcome-screen">

        <div class="content text-center">

            <div class="eyebrow">
                EXPLORE REGIONAL FLAVORS AND UNCOVER TIMELESS DELICACIES
            </div>

            <div class="main-title">
                WESTERN VISAYAS<br>CUISINE
            </div>

            <div class="tagline">
                Savor a journey of heritage, history, and island flavors.
            </div>

            <div class="gold-line"></div>

            <button class="arrow-btn" onclick="showProvinces()">
                <span class="material-symbols-outlined">arrow_right_alt</span>
            </button>

        </div>
    </div>

    <!-- Province Page -->
    <div id="provincePage" class="province-screen">

        <div class="province-content">

            <div class="province-title">
                WESTERN VISAYAS CUISINE
            </div>

            <div class="province-tagline">
                An authentic taste of Western Visayan Soul.
            </div>

            <div class="choose-title">
                Begin your Flavor Journey
            </div>

            <div class="province-list">

                <div class="province-item">
                    <a href="iloilo.html" class="province-circle iloilo"></a>
                </div>

                <div class="province-item">
                    <a href="capiz.html" class="province-circle capiz"></a>
                </div>

                <div class="province-item">
                    <a href="guimaras.html" class="province-circle guimaras"></a>
                </div>

                <div class="province-item">
                    <a href="aklan.html" class="province-circle aklan"></a>
                </div>

                <div class="province-item">
                    <a href="antique.html" class="province-circle antique"></a>
                </div>

            </div>

            <div class="gold-line"></div>

            <div class="back-arrow-container">
                <button class="back-arrow" onclick="showWelcome()">&#8592;</button>
            </div>

        </div>

    </div>

    <script>
        function showProvinces() {
            document.getElementById("welcomePage").style.display = "none";
            document.getElementById("provincePage").style.display = "flex";
        }

        function showWelcome() {
            document.getElementById("provincePage").style.display = "none";
            document.getElementById("welcomePage").style.display = "flex";
        }
    </script>

</body>
</html>
